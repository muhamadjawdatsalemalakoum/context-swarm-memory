<svg viewBox="0 0 760 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bl-title bl-desc">
  <title id="bl-title">CSM vs Hindsight on BEAM, 100K to 10M</title>
  <desc id="bl-desc">Two accuracy lines on the same axes. CSM: 0.737, 0.659, 0.569, 0.562. Hindsight: 0.734, 0.711, 0.739, 0.641. CSM trails Hindsight above 100K, but from 1M to 10M CSM stays flat while Hindsight drops, so the gap narrows from 0.17 to 0.08.</desc>
  <style>
    text { font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, "DejaVu Sans Mono", monospace; }
    .ttl { font-size: 17px; font-weight: 600; fill: #0e1a1e; }
    .sub { font-size: 11.5px; fill: #4b5b61; }
    .ax  { font-size: 11px; fill: #8b989d; }
    .xl  { font-size: 12.5px; font-weight: 600; fill: #0e1a1e; }
    .csmv { font-size: 11.5px; font-weight: 600; fill: #0a6453; }
    .hindv { font-size: 11.5px; font-weight: 600; fill: #6b7a80; }
    .cap { font-size: 10.5px; fill: #8b989d; }
    .grid { stroke: #eef1f2; stroke-width: 1; }
    .axis { stroke: #c2ccd1; stroke-width: 1.2; }
    .csm { fill: none; stroke: #0d7d68; stroke-width: 2.8; stroke-linejoin: round; stroke-linecap: round; }
    .csmdot { fill: #10b39a; stroke: #fff; stroke-width: 2; }
    .hind { fill: none; stroke: #9aa6ac; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 6 5; }
    .hinddot { fill: #9aa6ac; stroke: #fff; stroke-width: 2; }
    .leg { font-size: 12px; font-weight: 600; }
    .narrow { fill: #e9f6f2; stroke: #bfe3d8; }
    .narrowt { font-size: 10.5px; font-weight: 600; fill: #0a6453; }
  </style>

  <rect width="760" height="450" rx="16" fill="#ffffff"/>

  <text class="ttl" x="40" y="40">CSM vs Hindsight on BEAM — 100K → 10M</text>
  <text class="sub" x="40" y="60">Same answer + judge models. CSM trails above 100K, then stabilizes at the extreme as Hindsight drops.</text>

  <!-- legend -->
  <line x1="556" y1="36" x2="588" y2="36" class="csm"/><circle cx="572" cy="36" r="4.5" class="csmdot"/>
  <text class="leg" x="595" y="40" fill="#0a6453">CSM</text>
  <line x1="648" y1="36" x2="680" y2="36" class="hind"/><circle cx="664" cy="36" r="4.5" class="hinddot"/>
  <text class="leg" x="687" y="40" fill="#6b7a80">Hindsight</text>

  <!-- gridlines + y labels -->
  <line class="grid" x1="90" y1="90" x2="700" y2="90"/>
  <line class="grid" x1="90" y1="170" x2="700" y2="170"/>
  <line class="grid" x1="90" y1="250" x2="700" y2="250"/>
  <line class="axis" x1="90" y1="330" x2="700" y2="330"/>
  <text class="ax" x="80" y="94" text-anchor="end">0.80</text>
  <text class="ax" x="80" y="174" text-anchor="end">0.70</text>
  <text class="ax" x="80" y="254" text-anchor="end">0.60</text>
  <text class="ax" x="80" y="334" text-anchor="end">0.50</text>

  <!-- narrowing-gap markers (1M vs 10M) -->
  <line x1="487" y1="139" x2="487" y2="275" stroke="#dfe5e7" stroke-width="9" stroke-linecap="round"/>
  <line x1="660" y1="217" x2="660" y2="281" stroke="#bfe3d8" stroke-width="9" stroke-linecap="round"/>
  <rect class="narrow" x="556" y="300" width="150" height="34" rx="8"/>
  <text class="narrowt" x="566" y="315">gap 0.17 → 0.08</text>
  <text class="narrowt" x="566" y="329" style="font-weight:400;fill:#4b5b61">CSM flat, Hindsight −0.10</text>

  <!-- Hindsight line (drawn first, behind) -->
  <path class="hind" d="M140 143 L313 161 L487 139 L660 217"/>
  <circle class="hinddot" cx="140" cy="143" r="5"/>
  <circle class="hinddot" cx="313" cy="161" r="5"/>
  <circle class="hinddot" cx="487" cy="139" r="5"/>
  <circle class="hinddot" cx="660" cy="217" r="5"/>
  <text class="hindv" x="140" y="162" text-anchor="middle">0.734</text>
  <text class="hindv" x="313" y="151" text-anchor="middle">0.711</text>
  <text class="hindv" x="487" y="129" text-anchor="middle">0.739</text>
  <text class="hindv" x="640" y="210" text-anchor="end">0.641</text>

  <!-- CSM line -->
  <path class="csm" d="M140 141 L313 203 L487 275 L660 281"/>
  <circle class="csmdot" cx="140" cy="141" r="5.5"/>
  <circle class="csmdot" cx="313" cy="203" r="5.5"/>
  <circle class="csmdot" cx="487" cy="275" r="5.5"/>
  <circle class="csmdot" cx="660" cy="281" r="5.5"/>
  <text class="csmv" x="140" y="129" text-anchor="middle">0.737</text>
  <text class="csmv" x="313" y="221" text-anchor="middle">0.659</text>
  <text class="csmv" x="487" y="293" text-anchor="middle">0.569</text>
  <text class="csmv" x="660" y="299" text-anchor="middle">0.562</text>

  <!-- x labels -->
  <text class="xl" x="140" y="352" text-anchor="middle">100K</text>
  <text class="xl" x="313" y="352" text-anchor="middle">500K</text>
  <text class="xl" x="487" y="352" text-anchor="middle">1M</text>
  <text class="xl" x="660" y="352" text-anchor="middle">10M</text>
  <text class="ax" x="395" y="378" text-anchor="middle">BEAM split (per-unit haystack size)</text>

  <text class="cap" x="40" y="406">Single-trial · unmodified AMB runner · answer gemini-3.1-pro-preview, judge gemini-2.5-flash-lite.</text>
  <text class="cap" x="40" y="424">Hindsight = Vectorize's own committed AMB run; CSM answer context ~27–33K tokens vs Hindsight ~18–27K.</text>
</svg>
