<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bl-title bl-desc">
  <title id="bl-title">CSM BEAM ladder, 100K to 10M</title>
  <desc id="bl-desc">CSM BEAM accuracy declines gently from 0.737 at 100K to 0.562 at 10M, while the answer-visible context stays flat at roughly 27 to 33K tokens even as the per-unit haystack grows from 154K to 11.7M tokens.</desc>
  <style>
    text { font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, "DejaVu Sans Mono", monospace; }
    .ttl { font-size: 17px; font-weight: 600; fill: #0e1a1e; }
    .sub { font-size: 11.5px; fill: #4b5b61; }
    .ax  { font-size: 11px; fill: #8b989d; }
    .xl  { font-size: 12.5px; font-weight: 600; fill: #0e1a1e; }
    .val { font-size: 12px; font-weight: 600; fill: #0a6453; }
    .cap { font-size: 10.5px; fill: #8b989d; }
    .grid { stroke: #eef1f2; stroke-width: 1; }
    .axis { stroke: #c2ccd1; stroke-width: 1.2; }
    .acc { fill: none; stroke: #0d7d68; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #10b39a; stroke: #fff; stroke-width: 2; }
    .ctx { fill: none; stroke: #c2ccd1; stroke-width: 2; stroke-dasharray: 5 5; }
    .pill { fill: #e9f6f2; stroke: #bfe3d8; }
    .pilltext { font-size: 11.5px; font-weight: 600; fill: #0a6453; }
  </style>

  <rect width="760" height="430" rx="16" fill="#ffffff"/>

  <text class="ttl" x="40" y="42">CSM on BEAM — 100K → 10M</text>
  <text class="sub" x="40" y="62">Accuracy declines gently; answer-context to the model stays flat</text>

  <!-- flat-context annotation pill -->
  <rect class="pill" x="430" y="28" width="290" height="40" rx="10"/>
  <text class="pilltext" x="446" y="46">answer context ~27–33K tokens (flat)</text>
  <text class="pilltext" x="446" y="61" style="font-weight:400;fill:#4b5b61">while haystack grows 154K → 11.7M (76×)</text>

  <!-- gridlines + y labels (accuracy 0.5–0.8) -->
  <line class="grid" x1="90" y1="90" x2="700" y2="90"/>
  <line class="grid" x1="90" y1="170" x2="700" y2="170"/>
  <line class="grid" x1="90" y1="250" x2="700" y2="250"/>
  <line class="axis" x1="90" y1="330" x2="700" y2="330"/>
  <text class="ax" x="80" y="94" text-anchor="end">0.80</text>
  <text class="ax" x="80" y="174" text-anchor="end">0.70</text>
  <text class="ax" x="80" y="254" text-anchor="end">0.60</text>
  <text class="ax" x="80" y="334" text-anchor="end">0.50</text>

  <!-- flat "answer context" reference line (illustrative, ~30K mapped near 0.74 band) -->
  <line class="ctx" x1="140" y1="125" x2="660" y2="118"/>
  <text class="ax" x="660" y="110" text-anchor="end" style="fill:#8b989d">ctx 27K…33K</text>

  <!-- accuracy line + points -->
  <path class="acc" d="M140 140 L313 203 L487 275 L660 280"/>
  <circle class="dot" cx="140" cy="140" r="6"/>
  <circle class="dot" cx="313" cy="203" r="6"/>
  <circle class="dot" cx="487" cy="275" r="6"/>
  <circle class="dot" cx="660" cy="280" r="6"/>
  <text class="val" x="140" y="126" text-anchor="middle">0.737</text>
  <text class="val" x="313" y="189" text-anchor="middle">0.659</text>
  <text class="val" x="487" y="261" text-anchor="middle">0.569</text>
  <text class="val" x="660" y="266" text-anchor="middle">0.562</text>

  <!-- x labels -->
  <text class="xl" x="140" y="352" text-anchor="middle">100K</text>
  <text class="xl" x="313" y="352" text-anchor="middle">500K</text>
  <text class="xl" x="487" y="352" text-anchor="middle">1M</text>
  <text class="xl" x="660" y="352" text-anchor="middle">10M</text>
  <text class="ax" x="395" y="378" text-anchor="middle">BEAM split (per-unit haystack size)</text>

  <text class="cap" x="40" y="408">Single-trial · unmodified AMB runner · answer gemini-3.1-pro-preview, judge gemini-2.5-flash-lite · Hindsight baseline exists only at 100K.</text>
</svg>
